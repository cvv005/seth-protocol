<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大專屬 - 戰神賽特數據演算法選房終端系統</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff1e42;
            --secondary-red: #9e0b24;
            --dark-red: #4a030d;
            --bg-dark: #0a0103;
            --text-bright: #ffffff;
            --text-dim: #d19ca5;
            --panel-bg: rgba(20, 5, 8, 0.75);
            --neon-glow: 0 0 15px rgba(255, 30, 66, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-bright);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 背景動態特效 Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 跑馬燈 */
        .marquee-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(30, 0, 5, 0.85);
            border-bottom: 1px solid rgba(255, 30, 66, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            font-size: 0.85rem;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .marquee-content {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
            color: var(--text-dim);
            flex: 1;
            margin-right: 15px;
        }

        .marquee-tag {
            background: var(--primary-red);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .marquee-text {
            animation: marquee 25s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .top-status {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .audio-btn {
            background: rgba(255, 30, 66, 0.15);
            border: 1px solid rgba(255, 30, 66, 0.4);
            color: var(--text-bright);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .audio-btn:hover {
            background: var(--primary-red);
            box-shadow: var(--neon-glow);
        }

        /* 驗證頁面 (登入卡片) */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 30, 66, 0.4);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 30, 66, 0.2);
            backdrop-filter: blur(15px);
            text-align: center;
            transition: all 0.5s ease;
        }

        .brand-badge {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--secondary-red), #1a0004);
            border: 2px solid var(--primary-red);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--neon-glow);
            font-size: 2rem;
            color: var(--primary-red);
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff, #ff7a8f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            display: block;
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box {
            width: 100%;
            padding: 12px 10px0px 15px;
            background: rgba(10, 0, 3, 0.7);
            border: 1px solid rgba(255, 30, 66, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-box:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 10px rgba(255, 30, 66, 0.4);
        }

        .submit-btn {
            position: absolute;
            right: 5px;
            background: linear-gradient(135deg, #ff1e42, #a8001d);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: scale(1.03);
            box-shadow: var(--neon-glow);
        }

        .divider {
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
            font-size: 0.75rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 30, 66, 0.2);
        }

        .divider span {
            padding: 0 10px;
        }

        .trial-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 30, 66, 0.1);
            border: 1px solid rgba(255, 30, 66, 0.4);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .trial-btn:hover {
            background: rgba(255, 30, 66, 0.25);
            border-color: var(--primary-red);
            box-shadow: var(--neon-glow);
        }

        .footer-tag {
            margin-top: 25px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        /* 系統選房主介面 (登入後) */
        .main-dashboard {
            display: none;
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 1000px;
            margin-top: 60px;
            margin-bottom: 30px;
        }

        .dashboard-header {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 30, 66, 0.4);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: var(--secondary-red);
            border: 1px solid var(--primary-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
        }

        .timer-badge {
            background: rgba(255, 30, 66, 0.2);
            border: 1px solid var(--primary-red);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ff9ebb;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .room-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 30, 66, 0.3);
            border-radius: 16px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .room-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-red);
            box-shadow: var(--neon-glow);
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 30, 66, 0.2);
            padding-bottom: 8px;
        }

        .room-id {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        .room-status {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status-hot {
            background: rgba(255, 30, 66, 0.25);
            color: #ff6b81;
            border: 1px solid var(--primary-red);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-dim);
        }

        .stat-val {
            color: #fff;
            font-weight: bold;
        }

        .stat-val.highlight {
            color: var(--primary-red);
            font-size: 1rem;
        }

        .enter-room-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary-red), var(--secondary-red));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .enter-room-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(255, 30, 66, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <!-- 頂部即時跑馬燈 -->
    <div class="marquee-bar">
        <div class="marquee-tag"><i class="fa-solid fa-bolt"></i> 即時勝分戰報</div>
        <div class="marquee-content">
            <span class="marquee-text">
                VIP-88** 剛剛於 #08 號房獲利 +$128,400 | 會員 VIP-92** 於 #03 號房爆出大獎 +$245,000 | 數據算法已更新：賽特爆率提升 +38%
            </span>
        </div>
        <div class="top-status">
            <span id="currentTime">[00:00:00]</span>
            <button class="audio-btn" id="audioToggle"><i class="fa-solid fa-volume-high"></i> 音效 ON</button>
        </div>
    </div>

    <!-- 登入與驗證介面 -->
    <div class="auth-container" id="authBox">
        <div class="brand-badge">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="title">牛老大專屬</div>
        <div class="subtitle">戰神賽特 · 數據演算法選房終端系統</div>

        <div class="input-group">
            <label class="input-label">請輸入通行密碼</label>
            <div class="input-box-wrapper">
                <input type="password" class="input-box" id="accessKey" placeholder="請輸入解鎖密碼...">
                <button class="submit-btn" id="loginBtn">解鎖驗證</button>
            </div>
        </div>

        <div class="divider"><span>OR</span></div>

        <button class="trial-btn" id="trialBtn">
            <i class="fa-solid fa-clock-rotate-left"></i> 免費試用體驗（限定 10 分鐘）
        </button>

        <div class="footer-tag">SETH ENGINE V3.5 · DYNAMIC ENCRYPTED ACCESS</div>
    </div>

    <!-- 選房控制台主介面 -->
    <div class="main-dashboard" id="mainDashboard">
        <div class="dashboard-header">
            <div class="user-info">
                <div class="user-avatar"><i class="fa-solid fa-crown"></i></div>
                <div>
                    <h3 style="color:#fff; font-size:1.1rem;">牛老大 VIP 專屬頻道</h3>
                    <p style="color:var(--text-dim); font-size:0.8rem;">賽特演算法實時演算中</p>
                </div>
            </div>
            <div class="timer-badge">
                <i class="fa-solid fa-hourglass-half"></i>
                <span id="trialTimer">體驗倒數：10:00</span>
            </div>
        </div>

        <div class="room-grid" id="roomGrid">
            <!-- 房間卡片由 JS 自動動態渲染 -->
        </div>
    </div>

    <script>
        // 即時時間更新
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('currentTime').innerText = `[${timeStr}]`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Canvas 動態粒子背景
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 65; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speedY: Math.random() * 2 + 0.5,
                length: Math.random() * 40 + 10,
                opacity: Math.random() * 0.7 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, width, height);
            
            // 背景漸層
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#120004');
            gradient.addColorStop(0.5, '#050001');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 繪製紅光流星粒子
            particles.forEach(p => {
                ctx.beginPath();
                const pGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y - p.length);
                pGrad.addColorStop(0, `rgba(255, 30, 66, ${p.opacity})`);
                pGrad.addColorStop(1, 'rgba(255, 30, 66, 0)');
                ctx.strokeStyle = pGrad;
                ctx.lineWidth = 2;
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x, p.y - p.length);
                ctx.stroke();

                p.y += p.speedY;
                if (p.y - p.length > height) {
                    p.y = 0;
                    p.x = Math.random() * width;
                }
            });

            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // 登入與進入選房邏輯
        const authBox = document.getElementById('authBox');
        const mainDashboard = document.getElementById('mainDashboard');
        const loginBtn = document.getElementById('loginBtn');
        const trialBtn = document.getElementById('trialBtn');
        const trialTimer = document.getElementById('trialTimer');
        let timerInterval = null;

        function enterDashboard(isTrial = true) {
            authBox.style.display = 'none';
            mainDashboard.style.display = 'block';
            renderRooms();

            if (isTrial) {
                startTrialTimer(10 * 60); // 10 分鐘倒數
            } else {
                trialTimer.innerText = "VIP 尊榮版：永久授權";
            }
        }

        loginBtn.addEventListener('click', () => {
            const key = document.getElementById('accessKey').value;
            if (key.trim() !== '') {
                enterDashboard(false);
            } else {
                alert('請輸入有效的通行密碼！');
            }
        });

        trialBtn.addEventListener('click', () => {
            enterDashboard(true);
        });

        // 試用倒數計時器
        function startTrialTimer(duration) {
            let timer = duration;
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const minutes = Math.floor(timer / 60);
                const seconds = timer % 60;
                trialTimer.innerText = `體驗倒數：${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    alert('10分鐘免費體驗時間已結束，請輸入正式密碼繼續使用！');
                    mainDashboard.style.display = 'none';
                    authBox.style.display = 'block';
                }
            }, 1000);
        }

        // 動態生成房間數據
        function renderRooms() {
            const roomGrid = document.getElementById('roomGrid');
            roomGrid.innerHTML = '';

            for (let i = 1; i <= 6; i++) {
                const roomId = i < 10 ? `0${i}` : i;
                const winRate = (Math.random() * 20 + 78).toFixed(1);
                const rtp = (Math.random() * 40 + 110).toFixed(0);

                const cardHtml = `
                    <div class="room-card">
                        <div class="room-header">
                            <span class="room-id">賽特 #${roomId} 號房</span>
                            <span class="room-status status-hot">爆率極高</span>
                        </div>
                        <div class="stat-row">
                            <span>當前勝率演算：</span>
                            <span class="stat-val highlight">${winRate}%</span>
                        </div>
                        <div class="stat-row">
                            <span>預估 RTP 爆率：</span>
                            <span class="stat-val">${rtp}%</span>
                        </div>
                        <div class="stat-row">
                            <span>建議押注級距：</span>
                            <span class="stat-val">適中 / 高</span>
                        </div>
                        <button class="enter-room-btn" onclick="alert('已載入 #${roomId} 號房演算法數據分析模組！')">進入分析房間</button>
                    </div>
                `;
                roomGrid.innerHTML += cardHtml;
            }
        }
    </script>
</body>
</html>
