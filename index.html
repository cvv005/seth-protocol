<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大專屬 - 戰神賽特數據演算法選房終端系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;600;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        
        /* 深紅至極致暗黑漸層背景 */
        body {
            background: radial-gradient(circle at center, #3b0712 0%, #1a0308 55%, #050002 100%);
            color: #fecdd3;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 戰神奢華紅漸層文字效果 */
        .text-red-gradient {
            background: linear-gradient(135deg, #fff1f2 0%, #ff4d6d 35%, #c9184a 70%, #ff758f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
        }

        /* 霓虹紅磨砂玻璃卡片 */
        .crimson-card {
            background: rgba(18, 4, 8, 0.82);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 77, 109, 0.35);
            box-shadow: 0 0 40px rgba(225, 29, 72, 0.22),
                        inset 0 0 20px rgba(255, 77, 109, 0.08);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .crimson-card:hover {
            border-color: rgba(255, 77, 109, 0.7);
            box-shadow: 0 0 60px rgba(225, 29, 72, 0.38),
                        inset 0 0 30px rgba(255, 77, 109, 0.15);
        }

        /* 霓虹亮紅強烈按鈕 */
        .btn-crimson {
            background: linear-gradient(135deg, #ff4d6d 0%, #e60039 50%, #800020 100%);
            color: #ffffff;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(230, 0, 57, 0.5);
            transition: all 0.3s ease;
        }

        .btn-crimson:hover {
            background: linear-gradient(135deg, #ff758f 0%, #ff1a4d 50%, #a30029 100%);
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.8);
            transform: translateY(-1px);
        }

        /* 幽暗霓虹紅外框按鈕 */
        .btn-outline-crimson {
            background: rgba(35, 6, 13, 0.6);
            border: 1px solid rgba(255, 77, 109, 0.4);
            color: #ffe4e6;
            transition: all 0.3s ease;
        }

        .btn-outline-crimson:hover {
            border-color: #ff4d6d;
            background: rgba(70, 10, 25, 0.75);
            box-shadow: 0 0 22px rgba(225, 29, 72, 0.4);
            color: #ffffff;
        }

        /* 全螢幕 Canvas 粒子與雷射光流 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* 走馬燈遮罩邊緣 */
        .marquee-container {
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between relative selection:bg-rose-600 selection:text-white">

    <!-- 動態深紅粒子與科幻光雨 Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- 頂部資訊列 -->
    <header class="relative z-10 w-full px-4 py-3 flex justify-between items-center bg-black/50 backdrop-blur-md border-b border-rose-500/20">
        <!-- 左側：即時勝分戰報走馬燈 -->
        <div class="flex items-center space-x-2 text-xs md:text-sm">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-rose-500/15 border border-rose-500/50 text-rose-300 animate-pulse">
                <svg class="w-3.5 h-3.5 mr-1 text-rose-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path>
                </svg>
                即時勝分戰報
            </span>
            <div class="hidden sm:block marquee-container overflow-hidden w-48 md:w-80 h-5 relative">
                <div class="absolute whitespace-nowrap text-rose-200/80 text-xs font-orbitron animate-[marquee_12s_linear_infinite]" id="tickerText">
                    VIP-88** 剛剛於 #08 號房獲利 +$128,400 | 會員 VIP-99** 觸發神話連爆 +$350,000
                </div>
            </div>
        </div>

        <!-- 右側：會員狀態與音效切換 -->
        <div class="flex items-center space-x-3 text-xs md:text-sm font-orbitron">
            <div class="flex items-center space-x-1.5 text-rose-200 bg-rose-950/60 px-3 py-1 rounded-lg border border-rose-500/30">
                <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
                <span class="text-xs">[<span id="currentTime">18:24:05</span>] 會員 <span class="text-rose-400 font-bold">VIP-88**</span> 於 <span class="text-rose-400">#08</span></span>
            </div>
            
            <button id="soundBtn" onclick="toggleSound()" class="flex items-center space-x-1 px-3 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-all">
                <svg id="soundIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <span class="text-xs font-bold" id="soundStatus">音效 ON</span>
            </button>
        </div>
    </header>

    <!-- 中央核心驗證卡片 -->
    <main class="relative z-10 flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md crimson-card rounded-2xl p-8 text-center relative overflow-hidden">
            <!-- 暗紅霓虹頂部線條 -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-rose-500 to-transparent opacity-80"></div>

            <!-- 戰神賽特奢華紅 Logo 區塊 -->
            <div class="mx-auto w-20 h-20 mb-5 rounded-2xl bg-gradient-to-br from-rose-400 via-rose-700 to-rose-950 p-[1.5px] shadow-lg shadow-rose-600/30">
                <div class="w-full h-full bg-stone-950 rounded-[14px] flex items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-rose-600/15 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <!-- 戰術/戰神頭盔標誌 -->
                    <svg class="w-11 h-11 text-rose-500 drop-shadow-[0_2px_12px_rgba(244,63,94,0.6)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 2L4 6v6c0 5.25 3.75 10 8 11 4.25-1 8-5.75 8-11V6l-8-4z" fill="rgba(225,29,72,0.18)"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 8c1.5-2 3.5-2.5 5-1 1.5-1.5 3.5-1 5 1M8 12c0 2 1.8 3.5 4 3.5s4-1.5 4-3.5M12 11v4.5"/>
                        <circle cx="12" cy="12" r="1.2" fill="#ff4d6d"/>
                    </svg>
                </div>
            </div>

            <!-- 主標題與說明文字 -->
            <h1 class="text-3xl font-black tracking-wider text-red-gradient mb-1">
                牛老大專屬
            </h1>
            <p class="text-xs text-rose-200/70 tracking-widest font-medium mb-8">
                戰神賽特 · 數據演算法選房終端系統
            </p>

            <!-- 輸入密碼與按鈕 -->
            <div class="space-y-4">
                <div class="text-left">
                    <label class="block text-xs font-semibold text-rose-300/80 mb-1.5 pl-1">
                        請輸入通行密碼
                    </label>
                    <div class="relative flex items-center">
                        <input 
                            type="password" 
                            id="passcode" 
                            placeholder="請輸入解鎖密碼..." 
                            class="w-full px-4 py-3 bg-stone-950/90 border border-rose-500/35 rounded-xl text-rose-100 placeholder-rose-900/60 text-sm focus:outline-none focus:border-rose-400 focus:ring-1 focus:ring-rose-400/50 transition-all pr-24"
                        >
                        <button 
                            onclick="verifyPassword()" 
                            class="absolute right-1.5 px-4 py-1.5 btn-crimson text-xs rounded-lg font-bold tracking-wide"
                        >
                            解鎖驗證
                        </button>
                    </div>
                </div>

                <!-- 分隔線 -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-rose-500/20"></div>
                    <span class="flex-shrink mx-3 text-[10px] text-rose-400/50 uppercase font-orbitron tracking-widest">OR</span>
                    <div class="flex-grow border-t border-rose-500/20"></div>
                </div>

                <!-- 免費試用按鈕 -->
                <button 
                    onclick="startTrial()" 
                    class="w-full py-3 px-4 btn-outline-crimson rounded-xl text-xs font-bold flex items-center justify-center space-x-2 group"
                >
                    <svg class="w-4 h-4 text-rose-400 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>免費試用體驗（限定 10 分鐘）</span>
                </button>
            </div>

            <!-- 訊息提示框 -->
            <div id="messageBox" class="mt-4 hidden p-2.5 rounded-lg text-xs font-medium border text-center transition-all"></div>

            <!-- 底部系統版本標誌 -->
            <div class="mt-8 pt-4 border-t border-rose-950/60 text-[11px] text-rose-400/40 font-orbitron tracking-widest">
                SETH ENGINE V3.5 · DYNAMIC ENCRYPTED ACCESS
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="relative z-10 w-full text-center py-3 text-[11px] text-stone-600 font-orbitron">
        © 2026 BOSS NIU VIP SYSTEM. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // 即時時間更新
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('currentTime').textContent = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 音效控制狀態
        let soundEnabled = true;
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const statusText = document.getElementById('soundStatus');
            statusText.textContent = soundEnabled ? '音效 ON' : '音效 OFF';
            showMessage(soundEnabled ? '音效已開啟' : '音效已靜音', 'info');
        }

        // 訊息顯示提示
        function showMessage(msg, type = 'info') {
            const box = document.getElementById('messageBox');
            box.classList.remove('hidden', 'bg-red-500/20', 'border-red-500/40', 'text-red-300', 'bg-rose-500/20', 'border-rose-500/40', 'text-rose-300');
            
            if (type === 'error') {
                box.classList.add('bg-red-950/80', 'border-red-500/50', 'text-red-200');
            } else {
                box.classList.add('bg-rose-950/80', 'border-rose-500/50', 'text-rose-200');
            }
            
            box.textContent = msg;
            setTimeout(() => {
                box.classList.add('hidden');
            }, 3500);
        }

        // 密碼驗證邏輯
        function verifyPassword() {
            const input = document.getElementById('passcode').value.trim();
            if (!input) {
                showMessage('請輸入完整的通行密碼', 'error');
                return;
            }
            if (input === '8888' || input === 'niu888') {
                showMessage('通行密碼正確！正在進入選房系統...', 'info');
                setTimeout(() => {
                    alert('【系統驗證成功】歡迎進入牛老大專屬選房終端系統！');
                }, 800);
            } else {
                showMessage('通行密碼錯誤，請重新輸入或聯繫管理員', 'error');
            }
        }

        // 試用體驗邏輯
        function startTrial() {
            showMessage('已成功啟動 10 分鐘免費試用體驗權限！', 'info');
        }

        // Canvas 高質感深紅粒子與垂直數位光雨
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let rainDrops = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 飄浮紅光粒子
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = -(Math.random() * 0.7 + 0.2);
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.fadeSpeed = Math.random() * 0.006 + 0.002;
                const redColors = ['#ff4d6d', '#ff1a4d', '#ff758f', '#ffffff'];
                this.color = redColors[Math.floor(Math.random() * redColors.length)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.opacity -= this.fadeSpeed;

                if (this.opacity <= 0 || this.y < 0) {
                    this.reset();
                    this.y = canvas.height + 10;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff4d6d';
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        // 下落的光芒脈衝雨
        class RainDrop {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -Math.random() * canvas.height;
                this.length = Math.random() * 40 + 15;
                this.speed = Math.random() * 4 + 2;
                this.opacity = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.length);
                grad.addColorStop(0, 'rgba(255, 77, 109, 0)');
                grad.addColorStop(1, `rgba(225, 29, 72, ${this.opacity})`);

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.length);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        function initParticles() {
            particles = [];
            rainDrops = [];
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
            for (let i = 0; i < 35; i++) {
                rainDrops.push(new RainDrop());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 繪製背景紅暈光芒
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 50,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) / 1.4
            );
            gradient.addColorStop(0, 'rgba(159, 18, 57, 0.15)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製光雨與粒子
            rainDrops.forEach(r => {
                r.update();
                r.draw();
            });

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.onload = function() {
            initParticles();
            animate();
        };
    </script>
</body>
</html>
