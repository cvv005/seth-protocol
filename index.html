    <script>
        const ADMIN_KEY = "AIMINCVV168";
        const COOLDOWN_TIME = 300;
        let currentCooldownSeconds = 0;
        let cooldownTimer = null;
        let generatedCodesList = []; // 儲存發行過的代碼陣列

        window.addEventListener('DOMContentLoaded', () => {
            initCyberHexParticles();
            initVipRoomGrid();
            checkAuthOnStart();
            loadPasscodeHistory();
            setInterval(updatePasscodesRemainingTime, 1000); // 每一秒更新所有密碼剩餘時間倒數
        });

        // 升級版背景：賽博幾何光帶與脈衝光點 (絕無 12 星座)
        function initCyberHexParticles() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            // 金屬質感的科技粒子與線條
            const particles = Array.from({ length: 45 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 3 + 1,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                color: Math.random() > 0.4 ? '#ff0055' : (Math.random() > 0.5 ? '#8a2be2' : '#00ff88'),
                alpha: Math.random() * 0.6 + 0.2
            }));

            function animate() {
                ctx.clearRect(0, 0, width, height);

                // 畫出連線幾何矩陣
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 0, 85, ${0.12 * (1 - dist / 130)})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }

                // 畫出脈衝粒子點
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });

                requestAnimationFrame(animate);
            }
            animate();
        }

        function checkAuthOnStart() {
            const unlocked = sessionStorage.getItem('牛老大_unlocked');
            const trial = sessionStorage.getItem('牛老大_freetrial');
            if (unlocked === 'true') {
                closeModal('authModal');
            } else if (trial === 'true') {
                setTrialUI();
                closeModal('authModal');
            }
        }

        function isValidPasscode(input) {
            if (input === ADMIN_KEY) return "ADMIN";

            try {
                if (!input.startsWith("SETH-")) return false;

                const parts = input.split("-");
                if (parts.length !== 3) return false;

                const hexTime = parseInt(parts[1], 16);
                const validHours = parseInt(parts[2].slice(0, 2), 10);

                if (isNaN(hexTime) || isNaN(validHours)) return false;

                const now = Math.floor(Date.now() / 1000);
                const expireTime = hexTime + (validHours * 3600);

                if (now <= expireTime) {
                    return true;
                }
            } catch (e) {
                return false;
            }

            return false;
        }

        function verifyPasscode() {
            const input = document.getElementById('passcodeInput').value.trim().toUpperCase();
            const res = isValidPasscode(input);

            if (res === "ADMIN") {
                closeModal('authModal');
                openModal('adminModal');
            } else if (res === true) {
                sessionStorage.setItem('牛老大_unlocked', 'true');
                closeModal('authModal');
                document.getElementById('authErrorMsg').classList.add('hidden');
                document.getElementById('userStatusTag').innerText = "VIP 完整權限解鎖";
            } else {
                document.getElementById('authErrorMsg').classList.remove('hidden');
            }
        }

        // 隨機生成通行碼，並寫入紀錄
        function generateRandomPasscode() {
            const hours = parseInt(document.getElementById('validHoursSelect').value, 10);
            const nowSec = Math.floor(Date.now() / 1000);
            const nowHex = nowSec.toString(16).toUpperCase();
            
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let randomStr = "";
            for (let i = 0; i < 4; i++) {
                randomStr += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            const hourPad = String(hours).padStart(2, '0');
            const passcode = `SETH-${nowHex}-${hourPad}${randomStr}`;

            const item = {
                code: passcode,
                createdSec: nowSec,
                expireSec: nowSec + (hours * 3600),
                hours: hours
            };

            generatedCodesList.unshift(item); // 最新發行的排在前面
            savePasscodeHistory();
            renderPasscodeHistoryUI();

            navigator.clipboard.writeText(passcode);
            alert(`✅ 已生成高強度通行碼：\n${passcode}\n\n(時效：${hours} 小時，已自動複製至剪貼簿)`);
        }

        function savePasscodeHistory() {
            localStorage.setItem('牛老大_passcodes_history', JSON.stringify(generatedCodesList));
        }

        function loadPasscodeHistory() {
            const saved = localStorage.getItem('牛老大_passcodes_history');
            if (saved) {
                try {
                    generatedCodesList = JSON.parse(saved);
                } catch (e) {
                    generatedCodesList = [];
                }
            }
            renderPasscodeHistoryUI();
        }

        function clearPasscodeHistory() {
            generatedCodesList = generatedCodesList.filter(item => {
                const now = Math.floor(Date.now() / 1000);
                return now < item.expireSec;
            });
            savePasscodeHistory();
            renderPasscodeHistoryUI();
        }

        // 渲染已發行代碼與時效卡片
        function renderPasscodeHistoryUI() {
            const container = document.getElementById('passcodeHistoryContainer');
            if (!container) return;

            if (generatedCodesList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-xs text-gray-500 bg-black/30 rounded-xl border border-cyber-border/40">
                        目前尚無已發行的通行碼，點擊上方按鈕立即生成
                    </div>
                `;
                return;
            }

            const now = Math.floor(Date.now() / 1000);
            let html = '';

            generatedCodesList.forEach((item, index) => {
                const remainSec = item.expireSec - now;
                const isExpired = remainSec <= 0;

                html += `
                    <div class="bg-black/70 border ${isExpired ? 'border-red-900/60' : 'border-cyber-pink/40'} rounded-xl p-3 flex items-center justify-between text-xs font-orbitron">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="font-black text-white text-sm tracking-wider">${item.code}</span>
                                <button onclick="copyToClipboard('${item.code}')" class="text-[10px] bg-cyber-purple/30 hover:bg-cyber-purple/60 text-purple-200 border border-cyber-purple/50 px-2 py-0.5 rounded transition">
                                    <i class="fa-solid fa-copy"></i> 複製
                                </button>
                            </div>
                            <div class="text-[10px] text-gray-400">
                                總時效: ${item.hours} 小時
                            </div>
                        </div>
                        <div class="text-right">
                            ${isExpired ? 
                                `<span class="text-xs font-bold text-red-500 bg-red-950/40 px-2.5 py-1 rounded-md border border-red-800/40">已過期</span>` : 
                                `<div class="text-cyber-green font-bold text-xs" id="remain-time-${index}">${formatRemainingTime(remainSec)}</div>
                                 <div class="text-[9px] text-gray-500 mt-0.5">剩餘時間</div>`
                            }
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 即時倒數算式
        function updatePasscodesRemainingTime() {
            if (generatedCodesList.length === 0) return;
            const now = Math.floor(Date.now() / 1000);

            generatedCodesList.forEach((item, index) => {
                const el = document.getElementById(`remain-time-${index}`);
                if (el) {
                    const remainSec = item.expireSec - now;
                    if (remainSec <= 0) {
                        renderPasscodeHistoryUI(); // 重新整理狀態
                    } else {
                        el.innerText = formatRemainingTime(remainSec);
                    }
                }
            });
        }

        function formatRemainingTime(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            return `${String(hrs).padStart(2, '0')}時 ${String(mins).padStart(2, '0')}分 ${String(secs).padStart(2, '0')}秒`;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert(`已複製通行碼：${text}`);
        }

        function enterAsAdmin() {
            sessionStorage.setItem('牛老大_unlocked', 'true');
            closeModal('adminModal');
            document.getElementById('userStatusTag').innerText = "管理者模式";
        }

        function startFreeTrial() {
            sessionStorage.setItem('牛老大_freetrial', 'true');
            setTrialUI();
            closeModal('authModal');
        }

        function setTrialUI() {
            document.getElementById('userStatusTag').innerText = "免費試用模式";
            document.getElementById('userStatusTag').className = "text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-orbitron font-semibold";
        }

        function openModal(id) { 
            document.getElementById(id).classList.remove('hidden'); 
            if (id === 'adminModal') renderPasscodeHistoryUI();
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function setCapital(amount) {
            document.getElementById('capitalInput').value = amount;
            calculateStrategy();
        }

        function calculateStrategy() {
            const capital = parseFloat(document.getElementById('capitalInput').value) || 0;
            let singleBet = Math.max(1, Math.round(capital * 0.0048));
            let rounds = Math.floor(capital / (singleBet || 1));
            document.getElementById('singleBet').innerText = `${singleBet} 分`;
            document.getElementById('defenseRounds').innerText = `${rounds} 轉`;
        }

        function getRandomRoomNo() {
            return '#' + String(Math.floor(Math.random() * 4100) + 1).padStart(4, '0');
        }

        function initVipRoomGrid() {
            const grid = document.getElementById('vipRoomGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const card = document.createElement('div');
                card.className = "bg-black/50 border border-cyber-border/80 rounded-xl p-3 flex items-center justify-between";
                card.innerHTML = `
                    <div>
                        <div class="text-xs text-cyber-purple font-bold">VIP ${i} 爆分房</div>
                        <div class="text-lg font-black font-orbitron text-white">${getRandomRoomNo()}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-black font-orbitron text-cyber-green">${(95.0 + Math.random() * 4.8).toFixed(1)}%</div>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function triggerCooldownAction(source) {
            if (currentCooldownSeconds > 0) return;
            if (source === 'calc') calculateStrategy();
            if (source === 'refresh') {
                document.getElementById('kingRoomNo').innerText = getRandomRoomNo();
                initVipRoomGrid();
            }
            startCooldown(COOLDOWN_TIME);
        }

        function startCooldown(seconds) {
            currentCooldownSeconds = seconds;
            updateCooldownUI();
            cooldownTimer = setInterval(() => {
                currentCooldownSeconds--;
                if (currentCooldownSeconds <= 0) {
                    clearInterval(cooldownTimer);
                    document.getElementById('calcBtnText').innerText = "計算最適打法";
                    document.getElementById('refreshBtnText').innerText = "手動刷新";
                } else {
                    updateCooldownUI();
                }
            }, 1000);
        }

        function updateCooldownUI() {
            const mins = String(Math.floor(currentCooldownSeconds / 60)).padStart(2, '0');
            const secs = String(currentCooldownSeconds % 60).padStart(2, '0');
            document.getElementById('calcBtnText').innerText = `冷卻中 (${mins}:${secs})`;
            document.getElementById('refreshBtnText').innerText = `冷卻中 (${mins}:${secs})`;
            document.getElementById('headerCountdown').innerText = `${mins}:${secs}`;
        }

        function generateReport() {
            alert("『戰神幸運戰報』生成完成！已儲存當前數據截圖。");
        }
    </script>
</body>
</html>
